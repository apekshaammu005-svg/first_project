<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background-color: #f5f5f5;
    }

    /* NAVBAR */
    #navbar {
        height: 90px;
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-left: 30px;
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.2);
    }

    #navbar img {
        height: 86.66px;
        width: auto;
    }

    /* CONTAINER */
    #container {
        min-height: 85vh;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        gap: 30px;
        padding: 40px;
    }

    /* BOOK CARD */
    .box,
    .book {
        width: 300px;
        min-height: 500px;
        background-color: white;
        border-radius: 15px;
        padding: 20px;
        text-align: center;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* BOOK IMAGE */
    #book {
        width: 100%;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #book img {
        max-width: 200px;
        max-height: 280px;
        object-fit: contain;
    }

    /* BOOK NAME */
    #bookname {
        margin-top: 15px;
    }

    #bookname h3 {
        font-size: 20px;
        color: #222;
    }

    /* AUTHOR */
    #author {
        margin-top: 10px;
    }

    #author h4 {
        font-size: 15px;
        color: #555;
    }

    /* PRICE */
    #price {
        margin-top: 15px;
    }

    #price h2 {
        font-size: 22px;
        color: #222;
    }

    /* BUY BUTTON */
    #buy {
        margin-top: 20px;
    }

    .buy-btn {
        width: 80%;
        padding: 12px;
        background-color: #485594;
        color: white;

        /* REMOVE INNER/EXTRA BORDER */
        border: none;
        outline: none;
        box-shadow: none;

        border-radius: 30px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    /* HOVER EFFECT */
    .buy-btn:hover {
        background-color:#D8A67F;
        color: black;
    }
</style>
    
</head>
<body>
    <div id="navbar">
        <img  height="86.66px"  
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQj3Zg6oNGlHNwMmY5XX6Q7u6pXz24fR2063kRFL3vydA&s=10" alt="">
          <h1>BOOKSHELF</h1>

    </div>
    <div id="container">
     <div class="box">
        <div id="book">
            <img src="https://m.media-amazon.com/images/I/817Om545ROL.jpg" alt="">
        </div>
        <div id="bookname">
            <h3> UNTIL LOVE SETS US APART</h3>
        </div>
        <div id="author">
            <h4> By Aditya Nighhot</h4> 

        </div>

        <div id="price">
            <h2>300</h2>
        </div>
        <div id="buy">
            <button class="buy-btn" >BUY NOW</button>
        </div>
        </div>


     
     <div class="book">
        <div id="book">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRDLWm5pky3rNJWNbC1yR06QNBjTJHzh-ccGJiPWZphQ&s" alt="">
        </div>
        <div id="bookname">
            <h3> U n Me it's complicated</h3>
        </div>
        <div id="author">
            <h4> By Aditya Nighhot</h4> 

        </div>

        <div id="price">
            <h2>350</h2>
        </div>
        <div id="buy">
            <button class="buy-btn" >BUY NOW</button>
        </div>

     </div>
     <div class="book">
     <div id="book">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTG9vWQCjagJRlo-KtlHvDPCGwApgpzOM0Pd4Lc4uOO7A&s" alt="">
        </div>
        <div id="bookname">
            <h3> Tagged for Life</h3>
        </div>
        <div id="author">
            <h4> By Aditya Nighhot</h4> 

        </div>

        <div id="price">

    </div>
  </div>
     
</body>
</html>
